name: Build and deploy azure-upload-react-ui

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: azure-upload-react-ui-development
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: development

    env:
      OPENSHIFT_NAMESPACE: ${{ vars.OPENSHIFT_NAMESPACE }}
      CONTAINER_IMAGE: ${{ vars.CONTAINER_IMAGE }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_UPLOAD_API_URL }}
            VITE_UPLOAD_API_URL=${{ vars.VITE_UPLOAD_API_URL }}
            VITE_AUTH_API_URL=${{ vars.VITE_AUTH_API_URL }}
          tags: |
            ${{ env.CONTAINER_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.CONTAINER_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@v2
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          namespace: ${{ env.OPENSHIFT_NAMESPACE }}
          insecure_skip_tls_verify: false

      - name: Confirm OpenShift context
        run: |
          oc whoami
          oc project

      - name: Apply Service and Route
        run: |
          oc apply -f openshift/service.yaml
          oc apply -f openshift/route.yaml

      - name: Apply Deployment
        run: |
          sed \
            "s|IMAGE_PLACEHOLDER|${CONTAINER_IMAGE}:${IMAGE_TAG}|g" \
            openshift/deployment.yaml |
            oc apply -f -

      - name: Wait for rollout
        run: |
          oc rollout status \
            deployment/azure-upload-react-ui \
            --timeout=180s

      - name: Show deployed resources
        run: |
          oc get deployment azure-upload-react-ui
          oc get pods -l app=azure-upload-react-ui
          oc get service azure-upload-react-ui
          oc get route azure-upload-react-ui

      - name: Display application URL
        run: |
          UI_HOST="$(
            oc get route azure-upload-react-ui \
              -o jsonpath='{.spec.host}'
          )"

          echo "Application URL: https://${UI_HOST}"